name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List test files
        run: npx jest --listTests
      - name: Run all tests (verbose)
        run: npm test -- --runInBand --verbose
      - name: Run testEndpoints.js only
        run: npx jest testEndpoints.js --runInBand --verbose
      - name: Run tests/users.test.js only
        run: npx jest tests/users.test.js --runInBand --verbose
